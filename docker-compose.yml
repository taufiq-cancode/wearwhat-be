# Local development database. Port 5433 avoids clashing with any other local Postgres.
services:
  db:
    image: postgres:16-alpine
    container_name: wearwhat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wearwhat
      POSTGRES_PASSWORD: wearwhat
      POSTGRES_DB: wearwhat
    ports:
      - "5433:5432"
    volumes:
      - wearwhat-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wearwhat"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  wearwhat-pg:
